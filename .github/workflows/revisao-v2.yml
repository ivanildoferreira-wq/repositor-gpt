name: Revisao v2 - testes isolados
on:
  push:
    branches: [revisao-v2, revisao-v2-1, catalogo-intercalado, ranking-posicoes, corrigir-envio]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node --check < apps-script/Code.gs
      - name: Validate server cooldown rules
        run: node tests/participation.cjs
      - run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Dependency security gate
        run: |
          npm audit --json > dependency-audit.json
          node -e 'const a=require("./dependency-audit.json"); if(!a.metadata || a.metadata.vulnerabilities.total!==0) process.exit(1)'
      - run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/repositor-gpt/ >/dev/null && break; sleep 1; done
          cat > smoke.spec.cjs <<'EOF'
          const {test,expect}=require('@playwright/test');
          for(const width of [320,390,1280]) {
            test('interface isolada '+width,async({page})=>{
              await page.setViewportSize({width,height:844});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('**/*',async route=>{
                const url=new URL(route.request().url());
                if(url.origin==='http://127.0.0.1:4173') return route.continue();
                if(route.request().method()==='POST' && route.request().postData()?.includes('publicAction=participant')){
                  const payload=JSON.parse(new URLSearchParams(route.request().postData()).get('payload'));
                  const result={registered:true,open:true,code:'ABCDEF123456',projectIds:['EXT-001','EXT-002','EXT-003','EXT-004','EXT-005'],total:5,remaining:0,waitMs:600000,limit:5,minutes:10};
                  return route.fulfill({contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify({ok:true,result,requestId:payload.requestId})});
                }
                if(route.request().method()==='GET' && url.searchParams.has('callback')){
                  const cb=url.searchParams.get('callback');
                  return route.fulfill({contentType:'application/javascript',body:cb+'({ok:true,result:[]});'});
                }
                return route.abort();
              });
              await page.goto('http://127.0.0.1:4173/repositor-gpt/');
              await expect(page.locator('.project-card')).toHaveCount(46);
              const cards=page.locator('.project-card');
              const assertMixed=async()=>{
                await expect(cards).toHaveCount(46);
                const labels=await cards.locator('.modality-label').allTextContents();
                expect(labels.slice(0,44)).toEqual(Array.from({length:44},(_,i)=>i%2===0?'Mostra de Extensão':'Mostra Nacional'));
                expect(labels.slice(44)).toEqual(['Mostra Nacional','Mostra Nacional']);
              };
              await assertMixed();
              await page.getByRole('combobox',{name:'Filtrar por modalidade'}).selectOption('Mostra de Extensão');
              await expect(cards).toHaveCount(22);
              expect((await cards.locator('.modality-label').allTextContents()).every(x=>x==='Mostra de Extensão')).toBe(true);
              await page.getByRole('combobox').selectOption('Mostra Nacional');
              await expect(cards).toHaveCount(24);
              expect((await cards.locator('.modality-label').allTextContents()).every(x=>x==='Mostra Nacional')).toBe(true);
              await page.getByRole('combobox').selectOption('Todas');
              await assertMixed();
              await page.locator('.project-card').first().click();
              await page.getByRole('button',{name:'Avaliar este projeto'}).click();
              await expect(page.getByText('0 de 4 critérios preenchidos')).toBeVisible();
              await page.getByRole('button',{name:'Enviar avaliação'}).click();
              await expect(page.getByText('Preencha o código e os quatro critérios antes de continuar.')).toBeVisible();
              const ratings=await page.locator('.criterion').all();
              for(let i=0;i<4;i++) await ratings[i].getByRole('button',{name:new RegExp('^'+[4,5,4,3][i]+' -')}).click();
              await expect(page.locator('.score-preview strong')).toHaveText('4.15');
              await expect(page.getByText('4 de 4 critérios preenchidos')).toBeVisible();
              expect(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth)).toBe(true);
              await page.locator('nav:visible').getByRole('button',{name:'Ranking',exact:true}).click();
              await page.getByRole('button',{name:'Ver demonstração'}).click();
              await expect(page.locator('.ranking-column')).toHaveCount(3);
              await expect(page.locator('.ranking-column').first()).toContainText('Geral');
              await expect(page.locator('.ranking-column').first().locator('.rank-position').first()).toContainText('1º');
              for(const col of await page.locator('.ranking-column').all()){
                const positions=await col.locator('.rank-position').allTextContents();
                expect(positions).toEqual(Array.from({length:positions.length},(_,i)=>(i+1)+'º'));
              }
              await expect(page.locator('.ranking-column').first().locator('.rank-tie').first()).toBeVisible();
              await expect(page.getByRole('status')).toContainText('DADOS FICTÍCIOS');
              const target=page.locator('.ranking-column').first().locator('.rank-item').nth(3);
              const originalPosition=await target.locator('.rank-position').innerText();
              const code=(await target.locator('.rank-description small').first().innerText()).split(' · ')[0];
              const searchRanking=page.getByRole('textbox',{name:'Buscar projeto no ranking'});
              await searchRanking.fill(code);
              await expect(page.locator('.ranking-column').first().locator('.rank-item')).toHaveCount(1);
              await expect(page.locator('.ranking-column').first().locator('.rank-position')).toHaveText(originalPosition);
              await page.getByRole('button',{name:'Limpar busca'}).click();
              await expect(page.locator('.ranking-column').first().locator('.rank-item')).toHaveCount(12);
              expect(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth)).toBe(true);
              await page.getByRole('button',{name:'Ranking real'}).click();
              await expect(page.locator('.ranking-column')).toHaveCount(3);
              await page.locator('nav:visible').getByRole('button',{name:'Projetos',exact:true}).click();
              await page.getByRole('button',{name:'Obter meu código',exact:true}).click();
              await expect(page.getByText('Seu código individual está ativo')).toBeVisible();
              await expect(page.getByText('5 projetos avaliados')).toBeVisible();
              await expect(page.locator('.cooldown')).toContainText('Aguarde');
              await page.locator('.project-card').filter({hasText:'EXT-001'}).click();
              await expect(page.getByRole('button',{name:'Projeto já avaliado'})).toBeDisabled();
              await page.getByRole('button',{name:'Voltar aos projetos'}).click();
              await page.locator('.project-card').filter({hasText:'EXT-006'}).click();
              await page.getByRole('button',{name:'Avaliar este projeto'}).click();
              await expect(page.getByRole('button',{name:'Enviar avaliação'})).toBeDisabled();
              await page.reload();
              await expect(page.getByText('Seu código individual está ativo')).toBeVisible();
              expect(errors).toEqual([]);
            });
          }

          test('envio com acesso confirmado durante consulta lenta',async({page})=>{
            let sent=false;
            await page.addInitScript(()=>{
              const original=window.fetch.bind(window);
              window.__participantCalls=0;
              window.__voteSent=false;
              window.fetch=async(input,options)=>{
                if(!(options?.body instanceof URLSearchParams)||options.body.get('publicAction')!=='participant')return original(input,options);
                const p=JSON.parse(options.body.get('payload'));
                window.__participantCalls++;
                if(window.__participantCalls===2)await new Promise(resolve=>{window.__releaseParticipant=resolve});
                const voted=window.__voteSent;
                return new Response(JSON.stringify({ok:true,result:{registered:true,open:false,code:'ABCDEF123456',projectIds:voted?['EXT-001']:[],total:voted?1:0,remaining:voted?4:5,waitMs:0,limit:5,minutes:10},requestId:p.requestId}),{status:200,headers:{'content-type':'application/json'}});
              };
            });
            await page.route('**/*',async route=>{
              const url=new URL(route.request().url());
              if(url.origin==='http://127.0.0.1:4173')return route.continue();
              const fields=new URLSearchParams(route.request().postData()||'');
              if(fields.get('publicAction')==='submitEvaluation'){
                sent=true;
                await page.evaluate(()=>{window.__voteSent=true});
                return route.fulfill({contentType:'text/html',body:'<html></html>'});
              }
              if(url.searchParams.has('callback')){
                const data=url.searchParams.get('action')==='receipt'?{received:sent,score:5}:[];
                return route.fulfill({contentType:'application/javascript',body:url.searchParams.get('callback')+'('+JSON.stringify({ok:true,result:data})+');'});
              }
              return route.abort();
            });
            await page.goto('http://127.0.0.1:4173/repositor-gpt/');
            await page.getByRole('button',{name:'Obter meu código',exact:true}).click();
            await expect(page.getByText('Seu código individual está ativo')).toBeVisible();
            await expect(page.locator('.participation-panel button')).toBeEnabled({timeout:10000});
            await page.locator('.participation-panel button').click();
            await expect(page.locator('.participation-panel button')).toBeDisabled();
            await page.locator('.project-card').first().click();
            await page.getByRole('button',{name:'Avaliar este projeto'}).click();
            for(const rating of await page.locator('.criterion').all())await rating.getByRole('button',{name:/^5 -/}).click();
            await expect(page.getByRole('button',{name:'Enviar avaliação'})).toBeEnabled();
            await page.getByRole('button',{name:'Enviar avaliação'}).click();
            await expect(page.getByRole('button',{name:'Avaliação registrada'})).toBeVisible({timeout:12000});
            await page.evaluate(()=>window.__releaseParticipant());
            await expect(page.getByText('1 projetos avaliados')).toBeVisible();
            expect(sent).toBe(true);
          });
          EOF
          npx playwright test smoke.spec.cjs --reporter=html --trace=retain-on-failure
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: revisao-v2-report
          path: |
            playwright-report/
            test-results/
            dependency-audit.json
