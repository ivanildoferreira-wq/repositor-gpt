name: Build and deploy to GitHub Pages
on:
  push:
    branches: [feat/universo-if-avalia-mvp, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --audit-level=low
      - run: npm run build
        env:
          VITE_UNIVERSO_IF_API_URL: ${{ vars.VITE_UNIVERSO_IF_API_URL }}
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --audit-level=low
      - run: npm run build
        env:
          VITE_UNIVERSO_IF_API_URL: ${{ vars.VITE_UNIVERSO_IF_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
